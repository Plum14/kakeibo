{% extends 'kakeibo/kakeibo_base.html' %}

{% block content %}
    <div class="table-responsive">
        <table class="table table-striped table-sm">
            <thead>
                <tr>
                    <th>#</th>
                    <th>日付</th>
                    <th>カテゴリ</th>
                    <th>金額</th>
                    <th>メモ</th>
                </tr>
            </thead>
            <tbody>
                <td>{{ kakeibo.id }}</td>
                <td>{{ kakeibo.date }}</td>
                <td>{{ kakeibo.category }}</td>
                <td>{{ kakeibo.money }}</td>
                <td>{{ kakeibo.memo }}</td>
            </tbody>
        </table>
    </div>
<a class="btn btn-primary btn-lg" href="{% url 'kakeibo:kakeibo_update' kakeibo.pk %}">変更</a>
<a class="btn btn-danger btn-lg" href="{% url 'kakeibo:kakeibo_delete' kakeibo.pk %}">削除</a>
{% endblock %}
